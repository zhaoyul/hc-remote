name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    container: ubuntu:20.04
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends g++ ninja-build git curl ca-certificates libssl-dev python3 zip
      - name: Install CMake
        run: |
          curl -fsSL "https://github.com/Kitware/CMake/releases/download/v3.28.6/cmake-3.28.6-linux-$(uname -m).sh" -o /tmp/cmake.sh
          bash /tmp/cmake.sh --skip-license --prefix=/usr/local
      - uses: actions/checkout@v4
      - name: Build (static, glibc 2.31+)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DHCR_LINK_STATIC=ON -DOPENSSL_USE_STATIC_LIBS=ON
          cmake --build build -j4
      - name: Smoke test
        run: |
          set -e
          ./build/hc-remote-signal --port 18082 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 1
          ./build/hc-remote-peer --server ws://127.0.0.1:18082 --room smoke --peer a \
            --message hello-a --binary-demo --quit-after 3 --timeout 30 &
          a=$!
          sleep 0.5
          ./build/hc-remote-peer --server ws://127.0.0.1:18082 --room smoke --peer b \
            --message hello-b --binary-demo --quit-after 3 --timeout 30 &
          b=$!
          wait $a
          wait $b
      - name: Package
        run: |
          mkdir -p dist
          cp build/hc-remote-signal build/hc-remote-peer LICENSE deploy/THIRD-PARTY-LICENSES.txt dist/
          cd dist && zip -9 "../hc-remote-server-linux-${{ matrix.arch }}.zip" ./*
      - uses: actions/upload-artifact@v4
        with:
          name: server-linux-${{ matrix.arch }}
          path: hc-remote-server-linux-${{ matrix.arch }}.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (vcpkg)
        run: vcpkg install openssl:x64-windows-static-md nlohmann-json:x64-windows-static-md
      - name: Build
        run: |
          cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          cmake --build build --config Release -j4
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item build/Release/hc-remote-signal.exe, build/Release/hc-remote-peer.exe, LICENSE, deploy/THIRD-PARTY-LICENSES.txt dist/
          Compress-Archive -Path dist/* -DestinationPath hc-remote-server-windows-x86_64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: server-windows-x86_64
          path: hc-remote-server-windows-x86_64.zip

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install ninja
      - name: Cache universal OpenSSL
        id: openssl-cache
        uses: actions/cache@v4
        with:
          path: |
            build-openssl-universal
            build/openssl-src
          key: openssl-3.6.3-universal-${{ runner.arch }}
      - name: Build universal static OpenSSL
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: ./deploy/build-openssl-universal.sh
      - name: Build (universal)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DOPENSSL_ROOT_DIR="$PWD/build-openssl-universal" \
            -DOPENSSL_USE_STATIC_LIBS=ON
          cmake --build build -j4
      - name: Smoke test
        run: |
          set -e
          ./build/hc-remote-signal --port 18082 &
          server=$!
          trap 'kill $server 2>/dev/null || true' EXIT
          sleep 1
          ./build/hc-remote-peer --server ws://127.0.0.1:18082 --room smoke --peer a \
            --message hello-a --binary-demo --quit-after 3 --timeout 30 &
          a=$!
          sleep 0.5
          ./build/hc-remote-peer --server ws://127.0.0.1:18082 --room smoke --peer b \
            --message hello-b --binary-demo --quit-after 3 --timeout 30 &
          b=$!
          wait $a
          wait $b
      - name: Build static server binaries (standalone)
        run: |
          cmake -S . -B build-server -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DOPENSSL_ROOT_DIR="$PWD/build-openssl-universal" \
            -DOPENSSL_USE_STATIC_LIBS=ON \
            -DHCR_LINK_STATIC=ON
          cmake --build build-server -j4 --target hc-remote-signal hc-remote-peer
      - name: Package server (universal)
        run: |
          mkdir -p dist
          cp build-server/hc-remote-signal build-server/hc-remote-peer LICENSE deploy/THIRD-PARTY-LICENSES.txt dist/
          cd dist && zip -9 "../hc-remote-server-macos-universal.zip" ./*
      - name: Build and package client (universal)
        run: |
          export HCR_NATIVE_BUILD="$PWD/build"
          ./app/make-app.sh
          ditto -c -k --keepParent build/hc-remote.app hc-remote-macos.zip
          zip -9 hc-remote-macos.zip LICENSE deploy/THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: server-macos-universal
          path: hc-remote-server-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: client-macos
          path: hc-remote-macos.zip

  publish:
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum ./*.zip > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
